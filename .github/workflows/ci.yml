name: Assignment CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      model_source:
        description: Use the release model, or an untrained base for the deliberate gate test
        type: choice
        options: [release, untrained]
        default: release
      model_version:
        description: Trained model version to evaluate
        type: choice
        options: [v1, v2]
        default: v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      MODEL_SOURCE: ${{ inputs.model_source || 'release' }}
      MODEL_VERSION: ${{ inputs.model_version || 'v1' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install validation tools
        run: >-
          python -m pip install pyflakes==3.2.0 pytest==8.3.3
          fastapi==0.111.1 pydantic==2.8.2 httpx==0.27.2
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
      - name: Download trained release model
        if: env.MODEL_SOURCE == 'release'
        run: |
          mkdir -p "models/$MODEL_VERSION"
          checksum=model.sha256
          if [ "$MODEL_VERSION" = v2 ]; then checksum=model-v2.sha256; fi
          gh release download model-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern "$MODEL_VERSION.tar.gz" --pattern "$checksum" --dir models
          (cd models && sha256sum --check "$checksum")
          tar -xzf "models/$MODEL_VERSION.tar.gz" -C "models/$MODEL_VERSION"
          (cd "models/$MODEL_VERSION" && sha256sum --check files.sha256)
      - name: Install CPU inference dependencies
        run: |
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.44.2 tokenizers==0.19.1 numpy==1.26.4
      - name: Model evaluation
        run: |
          mkdir -p results
          model="models/$MODEL_VERSION"
          if [ "$MODEL_SOURCE" = untrained ]; then model=EleutherAI/pythia-70m; fi
          python training/predict.py --model "$model" --input data/validation.jsonl \
            --out results/ci_predictions.jsonl
          python tools/score.py results/ci_predictions.jsonl data/validation.jsonl \
            --out results/ci_score.json
      - name: Quality gate (minimum 95 percent valid JSON)
        run: >-
          python tools/score.py results/ci_predictions.jsonl data/validation.jsonl
          --min-validity 95
      - name: Save evaluation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-evaluation-${{ github.run_id }}
          path: |
            results/ci_predictions.jsonl
            results/ci_score.json
          if-no-files-found: ignore

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/gitleaks
          gh release download v8.30.1 --repo gitleaks/gitleaks \
            --pattern gitleaks_8.30.1_linux_x64.tar.gz \
            --pattern gitleaks_8.30.1_checksums.txt --dir /tmp/gitleaks
          cd /tmp/gitleaks
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz
      - name: Scan repository history
        run: |
          mkdir -p results
          /tmp/gitleaks/gitleaks git . --redact --report-format json \
            --report-path results/ci_secret_scan.json
      - name: Save secret scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secret-scan-${{ github.run_id }}
          path: results/ci_secret_scan.json
          if-no-files-found: ignore
